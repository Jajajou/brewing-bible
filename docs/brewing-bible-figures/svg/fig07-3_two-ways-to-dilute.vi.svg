<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 304" width="600" height="304" role="img">
<title>Two ways to lower TDS</title>
<desc>TDS giảm, EY giữ nguyên</desc>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="'Be Vietnam Pro','Inter','Noto Sans','Helvetica Neue',Arial,sans-serif">
<rect x="25" y="24" width="260" height="66" rx="12" fill="#F7E1D9" stroke="#C0563A" stroke-width="1"/>
<text x="155.0" y="52.0" font-size="15" fill="#C0563A" text-anchor="middle" font-weight="700">Rót thêm nước qua bã</text>
<text x="155.0" y="74.0" font-size="13" fill="#6B625A" text-anchor="middle" font-weight="400">ví dụ 1:16 → 1:18</text>
<line x1="155.0" y1="94.0" x2="155.0" y2="122.0" stroke="#C0563A" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="25" y="128" width="260" height="66" rx="12" fill="#F7E1D9" stroke="#C0563A" stroke-width="1"/>
<text x="155.0" y="156.0" font-size="15" fill="#C0563A" text-anchor="middle" font-weight="700">TDS giảm, EY tăng</text>
<text x="155.0" y="178.0" font-size="13" fill="#6B625A" text-anchor="middle" font-weight="400">bã bị chiết sâu hơn</text>
<line x1="155.0" y1="198.0" x2="155.0" y2="226.0" stroke="#C0563A" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="25" y="232" width="260" height="66" rx="12" fill="#F7E1D9" stroke="#C0563A" stroke-width="1"/>
<text x="155.0" y="260.0" font-size="15" fill="#C0563A" text-anchor="middle" font-weight="700">Lấy thêm phần chiết cuối</text>
<text x="155.0" y="282.0" font-size="13" fill="#6B625A" text-anchor="middle" font-weight="400">có thể kéo vị khô, chát</text>
<rect x="315" y="24" width="260" height="66" rx="12" fill="#DDEFEA" stroke="#2F8573" stroke-width="1"/>
<text x="445.0" y="52.0" font-size="15" fill="#2F8573" text-anchor="middle" font-weight="700">Dừng sớm, thêm nước vào cốc</text>
<text x="445.0" y="74.0" font-size="13" fill="#6B625A" text-anchor="middle" font-weight="400">pha cốt rồi pha loãng</text>
<line x1="445.0" y1="94.0" x2="445.0" y2="122.0" stroke="#2F8573" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="315" y="128" width="260" height="66" rx="12" fill="#DDEFEA" stroke="#2F8573" stroke-width="1"/>
<text x="445.0" y="156.0" font-size="15" fill="#2F8573" text-anchor="middle" font-weight="700">TDS giảm, EY giữ nguyên</text>
<text x="445.0" y="178.0" font-size="13" fill="#6B625A" text-anchor="middle" font-weight="400">chỉ đổi độ đậm</text>
<line x1="445.0" y1="198.0" x2="445.0" y2="226.0" stroke="#2F8573" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="315" y="232" width="260" height="66" rx="12" fill="#DDEFEA" stroke="#2F8573" stroke-width="1"/>
<text x="445.0" y="260.0" font-size="15" fill="#2F8573" text-anchor="middle" font-weight="700">Không lấy thêm gì từ bã</text>
<text x="445.0" y="282.0" font-size="13" fill="#6B625A" text-anchor="middle" font-weight="400">giữ nguyên phần đầu</text>
</g>
</svg>
